# DSH-Android profile layer. Applied after @deepseek-ai/dsh-base and
# @deepseek-ai/dsh-sdk-app (see the `android` profile template); third-party
# plugin bundles, the profile's cordis.patch.yml (written by dsh's plugin manager
# and config editor), $DSH_HOME/cordis.patch.yml and the app's overlay
# $DSH_HOME/android/app-layer.patch.yml (main.mjs passes it as --patch) apply on top.
#
# A patch replaces a row's whole `config`, so every config below is complete.

# ── persona ────────────────────────────────────────────────────────────────
- id: system-prompt
  config:
    personaPrefix: >-
      You are DSH, an AI agent running on the user's own Android phone, powered
      by the {{model}} model.

# ── workspace: the app-private home directory, never the process cwd ─────────
# The JNI launcher does not chdir; HOME is <filesDir>/home (ENGINE-CONTRACT §1).
- id: sandbox-policy
  config:
    # Android has no bwrap/landlock/seatbelt chain (sandbox-local would fail
    # closed). Run unconfined; mutating tools are approval-gated instead
    # (plugin-guard for shell/fs writes, plugin-device for device tools).
    mode: danger-full-access
    workspaceRoot: !!js "process.env.HOME || process.cwd()"

- id: approval
  config:
    policy: ask

- id: permission
  config:
    defaultPreset: android
    presets:
      android:
        sandbox: danger-full-access
        approval: ask
        name: android
        description: No OS sandbox on Android; every mutating action asks for approval.

# ── plugins (ENGINE-CONTRACT §2.6, docs/PLUGINS-CONTRACT.md) ─────────────────
# The phone side of extensions: android/ext/* SDK methods, the install gates (pnpmfile,
# binary scan, service precheck), status, skills, MCP helpers, and the androidExtensions
# service (mode category `extensions`, ask-before-call). It mounts dsh's own plugin manager
# (pnpm = the bundled pnpm on the node launcher, see main.mjs) and plugin market as its
# children on first use, so a boot pays nothing for them. dsh-base's own `plugin-manager`
# row stays off (below), and so do its agent tools (`tool-plugin-manager`).
- insert:
    - id: android-extensions
      name: '@dsh-android/plugin-extensions'

# dsh's official DeepSeek routes follow the account's `/models` listing and wait up to
# 5 s for it on the first connect: a network round trip on every cold start. Wait 1 ms:
# the first connect uses the built-in catalog, the listing loads in the background and
# applies from then on.
- id: llm-deepseek
  config:
    modelsTimeoutMs: 1
- id: llm-deepseek-account
  config:
    modelsTimeoutMs: 1

# The skill catalog (a user message in every conversation with skills on) lists name + one line
# per skill; dsh allows 500 characters per description. 250 keeps the "use when …" part of
# typical descriptions; the full SKILL.md loads with the `skill` tool (issue #36).
- id: tool-skill
  config:
    catalogDescriptionMaxLength: 250

# Web search on every route through DeepSeek Messages search (DEEPSEEK_API_KEY, or the account
# token on the account route), as before dsh 0.2.2: its default for third-party routes is the
# DeepSeek Search API, which charges per search (ENGINE-CONTRACT §1.1).
- id: web
  config:
    searchProvider: deepseek-official
    fetchProvider: http

# ── rows a phone does not need ───────────────────────────────────────────────
# Mounted on demand by android-extensions instead (see above). dsh-sdk-app turns the plugin
# manager's agent tools on; on the phone plugins install only through the app's gate.
- id: plugin-manager
  disabled: true
- id: tool-plugin-manager
  disabled: true
# Telemetry export is off on the phone (privacy; no feedback UI wired to it).
- id: session-telemetry-otel
  disabled: true
# Programmatic tool calling (code execution runtime + workflow tool built on it).
- id: ptc-runtime
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
# Office skills and tools / primary-runtime dependency tooling (desktop only: Office Kit runs
# LibreOffice, whose WebAssembly build is not shipped).
- id: skill-office
  disabled: true
- id: office-kit
  disabled: true
- id: tool-office
  disabled: true
- id: workspace-dependencies
  disabled: true
# Desktop-host rows dsh-sdk-app mounts: the browser RPC transport and uploads (`connection` would
# also serve its /api on android-account's loopback login server), the workspace registry, @-mention
# file indexes, and file cards (`present` + its link guidance: the app shows neither presented
# files nor links to its private files).
- id: connection
  disabled: true
- id: file-upload
  disabled: true
- id: workspace
  disabled: true
- id: file-reference-local
  disabled: true
- id: present
  disabled: true
- id: deliverable-file-references
  disabled: true
# Durable reminders (schedule_*): they fire only while the engine runs, and the app stops it when
# idle. Automations are the app's rules (rule_create), which wake the engine themselves.
- id: schedule
  disabled: true
- id: tool-schedule
  disabled: true
# Same-session goals (create_goal / update_goal, /goal, automatic goal rounds). A goal round is
# a new turn started while the session is idle: on the phone each round ended the run in the app,
# rounds never stopped by themselves (256 by default, also after a text-only answer), and any engine
# restart (idle shutdown, crash recovery, route change) silently disarmed them; their prompt taught
# the model to say the "next round" continues. Long tasks continue inside the turn instead, from
# the todo list (plugin-guard continuation.js, #37). The `goal` domain stays for old sessions' logs.
- id: tool-goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
# tmux context is meaningless on Android (no tmux).
- id: tmux-context
  disabled: true
# Cold start: the OTel exporter stack (+ got) and the pi-ai multi-provider adapter (+ openai,
# Anthropic, Google, Bedrock SDKs) were ~half of all modules loaded at boot (1002 → ~500).
# Telemetry export is off on the phone. Third-party models go through the much lighter
# llm-service-lite row below instead; build-engine.sh prunes the provider SDKs only pi-ai reaches.
- id: otel
  disabled: true
- id: llm-pi-ai
  disabled: true

# ── rows dsh-sdk-app mounts ─────────────────────────────────────────────────
# Current date/time/zone on each request (relative tasks: "alarm tomorrow 7:00", "SMS from the
# last hour", rule_create epochs). The zone is the process zone: the app sets TZ /
# DSH_ANDROID_TZ (android-env applies it); SDK prompts carry it as clientTimeZone (patch 11).
# `tool-ask-user` (ask_user_question → user-question/ask) needs nothing here: the app shows
# tap-to-choose cards; unattended runs get automatic "nobody is available" answers from plugin-guard.
- id: time-context
  config:
    refreshIntervalMs: 600000

# ── third-party model providers ─────────────────────────────────────────────
# @snnh/dsh-llm-service-lite (vendored, MIT): OpenAI-compatible endpoints with no vendor SDK.
# Dormant (no route) until the app writes this row's `config.providers` into the user layer
# $DSH_HOME/profiles/android/cordis.patch.yml (ENGINE-CONTRACT §1.1). Keys never appear there:
# each provider names `apiKeyEnv: DSH_ANDROID_KEY_<ID>`, set in the engine's environment.
# The row exists only here; the user layer replaces its `config` (patch layers never deep-merge).
- insert:
    - id: llm-service-lite
      name: '@snnh/dsh-llm-service-lite'

# ── DSH-Android plugins ────────────────────────────────────────────────────
- insert:
    - id: android-device
      name: '@dsh-android/plugin-device'
      # Per-tool timeouts come from each ToolDescriptor's timeoutMs (ENGINE-CONTRACT §3.1).

    - id: android-guard
      name: '@dsh-android/plugin-guard'
      config:
        locale: !!js "process.env.DSH_ANDROID_LOCALE || ''"
        # Built-ins that mutate state outside the device bridge and therefore ask
        # for approval (no OS sandbox on Android) — except read-only shell commands and
        # write/edit inside HOME/TMPDIR, which plugin-guard allows directly.
        askTools: [bash, write, edit]

    # Session modes (ENGINE-CONTRACT §2.5): the app sends each conversation's mode with
    # android/session/mode; the plugin hides the tools the mode leaves out (per agent,
    # subagents follow their root), turns the skill catalog off, adds the mode's prompt.
    - id: android-mode
      name: '@dsh-android/plugin-mode'

    # Automatic conversation titles (#89, plugin-guard session-title.js): after a conversation's first
    # reply a model names it (dsh-base's own `session-title-llm` provider stays off, as dsh-sdk-app
    # leaves it). The app's settings layer replaces this row: `disabled` when 自动生成对话标题 is off,
    # `config` = 标题模型 (none: the conversation's) and 推理等级.
    - id: android-session-title
      name: '@dsh-android/plugin-guard/session-title'
      config:
        reasoning: lowest

    # Reasoning translation on demand (#15, plugin-guard translate.js): `android/reasoning/translate`
    # over dsh's translator service (anonymous Bing / Google endpoints, no key, no session records).
    # dsh's own consumer of it (cot-translation, a web-client Remote) is not shipped.
    - id: translator
      name: '@deepseek-ai/dsh-experimental-translator'
    - id: android-translate
      name: '@dsh-android/plugin-guard/translate'

    # DeepSeek account login. dsh-base mounts the account provider
    # (`deepseek-account`, OAuth + PKCE against platform.deepseek.com) and the
    # `deepseek-account` model route; this row adds the loopback callback
    # server they need and exposes the account operations and events on the
    # SDK channel (account/* methods, account.* notifications).
    - id: android-account
      name: '@dsh-android/plugin-account'
      config:
        locale: !!js "process.env.DSH_ANDROID_LOCALE || ''"
        # The completion page in the in-app sign-in WebView opens this app link.
        appScheme: dsh-android
        appPackage: !!js "process.env.DSH_ANDROID_PACKAGE || ''"
